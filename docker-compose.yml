# Local development defaults only. Credentials here are not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://monitor:monitor@postgres:5432/monitor
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-dev-key}
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 3s
      timeout: 4s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent:
    build: .
    entrypoint: ["python", "-m", "agent"]
    command: ["--hosts", "5"]
    # Python as PID 1 ignores SIGTERM unless it installs a handler; init forwards it properly.
    init: true
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-dev-key}
    depends_on:
      - api

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
