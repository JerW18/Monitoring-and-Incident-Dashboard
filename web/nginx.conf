server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS. A variable makes nginx look the api up per request, rather than once at
    # startup, so recreating the api container doesn't leave the dashboard on 502s.
    resolver 127.0.0.11 valid=5s;
    set $api http://api:8000;

    location /v1/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Clears "close", so that the SSE stream's connection stays open.
        proxy_set_header Connection "";
        # SSE: send each event at once, and don't drop a stream that's quiet between pings.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
